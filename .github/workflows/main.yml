name: Recon Optimizer

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target domain or IP'
        required: true

jobs:
  recon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Recon Optimizer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p outputs
          python main.py --target ${{ github.event.inputs.target }}

      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: recon-results-${{ github.event.inputs.target }}
          path: outputs/
